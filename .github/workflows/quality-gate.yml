name: HAKIM Omega Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      CLOUDFLARE_API_TOKEN: ''
      OPENROUTER_API_KEY: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Keyless startup guard
        run: |
          node -e "import('./server.js').then(() => setTimeout(() => process.exit(0), 500)).catch(e => { console.error(e); process.exit(1) })"
