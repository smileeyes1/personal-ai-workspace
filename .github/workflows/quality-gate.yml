name: HAKIM Omega Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      GEMINI_API_KEY: test-key
      GROQ_API_KEY: ''
      CLOUDFLARE_API_TOKEN: ''
      OPENROUTER_API_KEY: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime information
        run: node --version && npm --version

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Validate browser identity layer syntax
        run: node --check enterprise-auth.js && node --check enterprise-graph.js && grep -q 'src="/enterprise-auth.js"' index.html

      - name: Build
        run: npm run build

      - name: Start application for integration tests
        run: |
          nohup npm start > /tmp/hakim-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hakim-server.log
          exit 1

      - name: Test
        run: npm test

      - name: Runtime smoke check
        run: curl -fsS http://127.0.0.1:3000/api/health

      - name: Keyless-safe startup guard
        env:
          GEMINI_API_KEY: ''
        run: |
          pkill -f 'node server.js' || true
          nohup npm start > /tmp/hakim-keyless.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/keyless-health.json; then
              grep -q '"localDeterministic":"READY"' /tmp/keyless-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hakim-keyless.log
          exit 1
