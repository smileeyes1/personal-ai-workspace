name: HAKIM Ω Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Secret scan (tracked source only)
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(AIza[0-9A-Za-z_-]{20,}|GEMINI_API_KEY[[:space:]]*=[[:space:]]*[^$\n][^\n]*|sk-[A-Za-z0-9]{20,})' -- ':!bun.lock' ':!*.md' ':!.env.example'; then
            echo 'Potential hard-coded API secret detected.'
            exit 1
          fi
          echo 'No obvious hard-coded API secret detected.'

      - name: Verify keyless startup
        shell: bash
        run: |
          set -euo pipefail
          unset GEMINI_API_KEY GROQ_API_KEY CLOUDFLARE_API_TOKEN OPENROUTER_API_KEY
          node --check server.js
          echo 'Server source passes syntax validation with provider secrets absent.'
