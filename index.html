<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مساعدي Ω — مساحة العمل الذكية</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif;background:#f5f7fb;color:#172033}.app{height:100dvh;display:flex}.side{width:250px;background:#111827;color:#fff;padding:16px;display:flex;flex-direction:column;gap:12px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{padding:17px;background:#fff;border-bottom:1px solid #e1e5eb;display:flex;justify-content:space-between}.content{flex:1;overflow:auto;padding:20px}.messages{max-width:900px;margin:auto}.msg{display:flex;margin:13px 0}.bubble{padding:13px 16px;border-radius:16px;max-width:88%;white-space:pre-wrap;line-height:1.8}.user{justify-content:flex-start}.user .bubble{background:#eef2ff}.assistant{justify-content:flex-end}.assistant .bubble{background:#fff;border:1px solid #e1e5eb}.composer{padding:12px;background:#fff;border-top:1px solid #e1e5eb}.box{max-width:900px;margin:auto;border:1px solid #dfe4eb;border-radius:17px;padding:10px}.textarea{width:100%;min-height:55px;border:0;outline:0;resize:none;font:inherit}.actions{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:#eef0f4}.send{background:#3157d5;color:white}.chip{display:inline-block;background:#eef0f4;padding:5px 8px;border-radius:8px;margin:3px;font-size:12px}.settings{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}.card{background:#fff;padding:22px;border-radius:18px;width:min(560px,92%)}input,select{width:100%;padding:10px;margin:6px 0 14px;box-sizing:border-box}.hidden{display:none}@media(max-width:700px){.side{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><b>مساعدي Ω</b><button class="btn" id="new">＋ محادثة جديدة</button><div style="flex:1"></div><button class="btn" id="settingsBtn">⚙ الإعدادات</button></aside>
<main class="main"><header class="top"><b>مساحة العمل الذكية</b><span id="status">Gemini غير مفعّل</span></header><section class="content"><div class="messages" id="messages"><div id="welcome" style="text-align:center;margin-top:15vh"><h1>مرحبًا 👋</h1><p>تحدث طبيعيًا، ارفع ملفاتك، واطلب تحليلها أو إنشاء نتيجة.</p></div></div></section><footer class="composer"><div class="box"><div id="files"></div><textarea id="prompt" class="textarea" placeholder="اكتب ما تريد…"></textarea><div class="actions"><button class="btn" id="attach">📎 إرفاق</button><input id="fileInput" class="hidden" type="file" multiple accept=".txt,.md,.csv,.json,.html,.pdf,.docx,.xlsx,.xls,.png,.jpg,.jpeg,.webp"><span style="flex:1"></span><button class="btn send" id="send">إرسال ➤</button></div></div></footer></main></div>
<div class="settings" id="settings"><div class="card"><h2>الإعدادات</h2><label>Gemini API Key</label><input id="key" type="password" autocomplete="off" placeholder="ألصق المفتاح هنا"><label>النموذج</label><select id="model"><option value="gemini-2.5-flash">gemini-2.5-flash</option><option value="gemini-2.5-pro">gemini-2.5-pro</option></select><button class="btn send" id="save">حفظ واختبار</button> <button class="btn" id="clear">حذف المفتاح</button><p id="test"></p><button class="btn" id="close">إغلاق</button></div></div>
<script>
const $=id=>document.getElementById(id),KEY='omega_key',MODEL='omega_model';let files=[],history=[];
function status(){const k=localStorage.getItem(KEY);$('status').textContent=k?'Gemini جاهز ✓':'Gemini غير مفعّل'}
function msg(role,text,names=[]){$('welcome')?.remove();const d=document.createElement('div');d.className='msg '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;if(names.length){const x=document.createElement('div');names.forEach(n=>{const c=document.createElement('span');c.className='chip';c.textContent=n;x.appendChild(c)});b.appendChild(x)}d.appendChild(b);$('messages').appendChild(d);$('messages').parentElement.scrollTop=1e9;return b}
function dataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function extract(f){const e=f.name.split('.').pop().toLowerCase();if(['txt','md','csv','json','html'].includes(e))return{name:f.name,type:'text',text:await f.text()};if(e==='pdf'){throw Error('قارئ PDF يحتاج مكتبة PDF.js. هذه النسخة الآمنة لا تدّعي قراءة PDF دونها.')}if(e==='docx'){throw Error('قارئ DOCX يحتاج Mammoth.')}if(['xlsx','xls'].includes(e)){throw Error('قارئ Excel يحتاج SheetJS.')}if(f.type.startsWith('image/'))return{name:f.name,type:'image',mime:f.type,data:(await dataURL(f)).split(',')[1]};throw Error('نوع الملف غير مدعوم')}
$('attach').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{files=[];$('files').innerHTML='';for(const f of e.target.files){try{const x=await extract(f);files.push(x);const c=document.createElement('span');c.className='chip';c.textContent=f.name;$('files').appendChild(c)}catch(err){const c=document.createElement('span');c.className='chip';c.textContent=f.name+' — '+err.message;$('files').appendChild(c)}}};
$('new').onclick=()=>{files=[];history=[];$('files').innerHTML='';$('prompt').value='';$('messages').innerHTML='<div id="welcome" style="text-align:center;margin-top:15vh"><h1>محادثة جديدة</h1><p>ابدأ بطلبك مباشرة.</p></div>'};
$('settingsBtn').onclick=()=>{$('settings').style.display='flex';$('key').value=localStorage.getItem(KEY)||'';$('model').value=localStorage.getItem(MODEL)||'gemini-2.5-flash'};$('close').onclick=()=>{$('settings').style.display='none'};$('clear').onclick=()=>{localStorage.removeItem(KEY);status();$('test').textContent='تم حذف المفتاح.'};
async function gemini(t){const key=localStorage.getItem(KEY);if(!key)throw Error('أضف مفتاح Gemini من الإعدادات.');const model=localStorage.getItem(MODEL)||'gemini-2.5-flash';const parts=[{text:'أنت مساعد عربي عملي ودقيق. نفذ طلب المستخدم ولا تدّع تنفيذ شيء لم يحدث.\n\n'+t}];for(const f of files)f.type==='image'?parts.push({inline_data:{mime_type:f.mime,data:f.data}}):parts.push({text:'\n--- '+f.name+' ---\n'+f.text.slice(0,180000)});const contents=[...history.slice(-12),{role:'user',parts}];const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents,generationConfig:{temperature:.25,maxOutputTokens:8192}})});const j=await r.json();if(!r.ok)throw Error(j?.error?.message||'فشل الاتصال');return j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'لم يُرجع النموذج نصًا'}
$('save').onclick=async()=>{const k=$('key').value.trim();if(!k){$('test').textContent='أدخل المفتاح';return}localStorage.setItem(KEY,k);localStorage.setItem(MODEL,$('model').value);$('test').textContent='جارٍ الاختبار…';try{await gemini('أجب بكلمة واحدة: جاهز');$('test').textContent='الاتصال ناجح ✓';status()}catch(e){localStorage.removeItem(KEY);$('test').textContent='فشل: '+e.message;status()}};
async function send(){const t=$('prompt').value.trim();if(!t&&!files.length)return;msg('user',t||'أرفقت ملفات.',files.map(f=>f.name));$('prompt').value='';const b=msg('assistant','جارٍ التنفيذ…');try{const out=await gemini(t||'حلل الملفات المرفقة وقدم نتيجة عملية.');b.textContent=out;history.push({role:'user',parts:[{text:t||'أرفقت ملفات.'}]});history.push({role:'model',parts:[{text:out}]})}catch(e){b.textContent='تعذر التنفيذ: '+e.message}files=[];$('files').innerHTML=''}
$('send').onclick=send;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});status();
</script></body></html>
